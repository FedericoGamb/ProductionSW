<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione Produzione</title>
<style>
:root{--p:#102935;--bg:#eef2f4;--card:#fff;--b:#d9e0e4;--mut:#64748b;--red:#c0392b;--ok:#1e8e5a}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:#0f1c22}
.field{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:7px;font-size:14px;background:#fff}
.btn{background:var(--p);color:#fff;border:0;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.4)}
.link{background:none;border:0;color:var(--red);cursor:pointer;font-size:12px}
#login{min-height:100vh;display:grid;place-items:center;background:var(--p);padding:16px}
#login form{background:#fff;padding:32px;border-radius:14px;width:100%;max-width:360px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{height:80px;border:2px dashed var(--b);border-radius:10px;display:grid;place-items:center;color:var(--mut);font-size:12px;overflow:hidden}
.logo img{max-height:100%;max-width:100%}
h1{margin:0;text-align:center;color:var(--p);font-size:20px}h2{margin:0 0 14px;color:var(--p);font-size:16px}
header{background:var(--p);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header .l{display:flex;gap:12px;align-items:center}header .sl{width:44px;height:44px;border:1px dashed rgba(255,255,255,.5);border-radius:6px;display:grid;place-items:center;font-size:9px;overflow:hidden}
header .sl img{max-width:100%;max-height:100%}small{opacity:.75}
main{max-width:1050px;margin:0 auto;padding:24px;display:grid;gap:22px}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grid2{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:8px;align-items:center}ul{list-style:none;padding:0;margin:12px 0 0}li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--b);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);padding:8px 4px}td{padding:8px 4px;border-top:1px solid var(--b)}
.err{color:var(--red);font-size:14px;margin:0}.ok{color:var(--ok);font-weight:600;font-size:14px}.mut{color:var(--mut);font-size:13px}
.folder{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.n{flex:1;font-size:12px;color:var(--mut)}.hidden{display:none!important}
</style>
</head>

      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">Dati di produzione registrati</h2>
        <div class="row" style="flex-wrap:wrap;gap:6px">
          <span class="mut">Dal</span><input class="field" id="fd" type="date" style="width:auto;padding:7px 9px">
          <span class="mut">Al</span><input class="field" id="fa" type="date" style="width:auto;padding:7px 9px">
          <button class="btn hidden" id="clr" title="Rimuovi filtro" style="padding:7px 11px">✕</button>
          <button class="btn" id="exp">Esporta CSV (Excel)</button>
        </div>
      </div>
      <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Data/Ora</th><th>Tipo</th><th>Operatore</th><th>Prodotto</th><th>Causa</th><th>Pezzi</th><th>Durata</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = "produzione-data-v1";
let data = {operatori:[],prodotti:[],scarti:[],fermi:[],registrazioni:[]};
let role = null, dir = null;

/* ---------- IndexedDB per ricordare la cartella ---------- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("produzione", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const kvSet = async (k, v) => { const db = await idb(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); };
const kvGet = async k => { const db = await idb(); return new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); };

/* ---------- Salvataggio ---------- */
async function readFolder() {
  try {
    const fh = await dir.getFileHandle("produzione.json", {create: false});
    const txt = await (await fh.getFile()).text();
    data = {...data, ...JSON.parse(txt)};
  } catch { await writeFolder(); }
}
async function writeFolder() {
  if (!dir) return;
  const fh = await dir.getFileHandle("produzione.json", {create: true});
  const w = await fh.createWritable(); await w.write(JSON.stringify(data, null, 2)); await w.close();
  const ch = await dir.getFileHandle("registrazioni.csv", {create: true});
  const w2 = await ch.createWritable(); await w2.write("\ufeff" + csv()); await w2.close();
}
async function save() {
  localStorage.setItem(LS, JSON.stringify(data));
  try { await writeFolder(); } catch (e) { alert("Impossibile scrivere nella cartella: " + e.message); }
  render();
}
async function connect(h) { dir = h; await readFolder(); $("#fname").textContent = "📁 " + h.name; $("#fname").className = ""; $("#reauth").classList.add("hidden"); render(); }

$("#pick").onclick = async () => {
  if (!window.showDirectoryPicker) return alert("Usa Google Chrome o Microsoft Edge per collegare una cartella.");
  try { const h = await window.showDirectoryPicker({mode: "readwrite"}); await kvSet("dir", h); await connect(h); } catch {}
};
$("#reauth").onclick = async () => { const h = await kvGet("dir"); if (h && await h.requestPermission({mode: "readwrite"}) === "granted") connect(h); };

function setLogo(src) { document.querySelectorAll("[data-logo]").forEach(e => e.innerHTML = `<img src="${src}" alt="Logo">`); }

/* ---------- Login ---------- */
function login(u, p) { if (u === "admin" && p === "1234") return "admin"; if (u === "user" && p === "1234") return "operatore"; return null; }
$("#loginForm").onsubmit = e => { e.preventDefault(); const r = login($("#u").value.trim(), $("#pw").value); if (!r) return $("#lerr").textContent = "Credenziali non valide"; sessionStorage.setItem("ruolo", r); start(r); };
$("#logout").onclick = () => { sessionStorage.removeItem("ruolo"); location.reload(); };
function start(r) {
  role = r; $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#who").textContent = (r === "admin" ? "Amministratore" : "Operatore") + " · " + new Date().toLocaleDateString("it-IT", {weekday:"long",day:"numeric",month:"long",year:"numeric"});
  render();
}

/* ---------- Utility ---------- */
const fmt = (sec = 0) => { const p = n => String(n).padStart(2, "0"); return `${p(Math.floor(sec/3600))}:${p(Math.floor(sec%3600/60))}:${p(sec%60)}`; };
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
function csv(list = data.registrazioni) {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Data/Ora","Tipo","Operatore","Prodotto","Causa","Pezzi","Durata (hh:mm:ss)"];
  return [head.map(q).join(";"), ...list.map(r => [new Date(r.ts).toLocaleString("it-IT"), r.tipo, r.operatore, r.prodotto, r.causa, r.pezzi ?? "", r.tipo === "Fermo" ? fmt(r.durataSec) : ""].map(q).join(";"))].join("\n");
}
function filtro() {
  const d = $("#fd") ? $("#fd").value : "", a = $("#fa") ? $("#fa").value : "";
  if (!d && !a) return {list: data.registrazioni, attivo: false};
  const list = data.registrazioni.filter(r => {
    const g = iso(new Date(r.ts));
    if (d && g < d) return false;
    if (a && g > a) return false;
    return true;
  });
  return {list, attivo: true};
}
$("#exp").onclick = () => {
  const f = filtro(), a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv(f.list)], {type: "text/csv;charset=utf-8"}));
  const range = f.attivo ? `_dal_${$("#fd").value || "inizio"}_al_${$("#fa").value || "oggi"}` : "";
  a.download = `produzione${range}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};
$("#fd").oninput = $("#fa").oninput = render;
$("#clr").onclick = () => { $("#fd").value = ""; $("#fa").value = ""; render(); };
const opts = (list, label) => `<option value="">${label}</option>` + list.map(i => `<option value="${esc(i.a + " " + i.b)}">${esc(i.a)} — ${esc(i.b)}</option>`).join("");

/* ---------- Render ---------- */
const REG = [["operatori","Operatori","Nome","Cognome"],["prodotti","Prodotti","Codice","Descrizione"],["scarti","Cause di scarto","Codice","Descrizione"],["fermi","Cause di fermo","Codice","Descrizione"]];
let opState = {op:"", prod:""};
function render() {
  if (!role) return;
  const v = $("#view");
  if (role === "admin") {
    v.innerHTML = `<div class="grid2">${REG.map(([k,t,a,b]) => `
      <section class="card"><h2>${t}</h2>
        <form class="row" data-add="${k}"><input class="field" name="a" placeholder="${a}" required><input class="field" name="b" placeholder="${b}" required><button class="btn">Aggiungi</button></form>
        <ul>${data[k].map(i => `<li><span><b>${esc(i.a)}</b> ${esc(i.b)}</span><button class="link" data-del="${k}:${i.id}">Elimina</button></li>`).join("") || `<li class="mut">Nessun elemento</li>`}</ul>
      </section>`).join("")}</div>`;
    v.querySelectorAll("[data-add]").forEach(f => f.onsubmit = e => { e.preventDefault(); const a = f.a.value.trim(), b = f.b.value.trim(); if (!a || !b) return; data[f.dataset.add].push({id: uid(), a, b}); save(); });
    v.querySelectorAll("[data-del]").forEach(bt => bt.onclick = () => { const [k, id] = bt.dataset.del.split(":"); data[k] = data[k].filter(x => x.id !== id); save(); });
  } else {
    v.innerHTML = `
      <section class="card"><h2>Turno</h2><div class="grid2" style="gap:12px">
        <select class="field" id="op">${opts(data.operatori, "Seleziona operatore")}</select>
        <select class="field" id="prod">${opts(data.prodotti, "Seleziona prodotto")}</select></div>
        <p class="ok" id="msg"></p></section>
      <div class="grid2">
        <section class="card"><h2>Pezzi prodotti</h2>
          <div class="row"><button class="btn" id="minusP">−</button><input class="field" id="pzp" type="number" min="1" value="1" style="text-align:center;font-weight:700;font-size:18px"><button class="btn" id="plusP">+</button></div>
          <button class="btn" style="width:100%;margin-top:12px" id="regP">Registra produzione</button></section>
        <section class="card"><h2>Pezzi scartati</h2>
          <div class="row"><button class="btn" id="minus">−</button><input class="field" id="pz" type="number" min="1" value="1" style="text-align:center;font-weight:700;font-size:18px"><button class="btn" id="plus">+</button></div>
          <select class="field" id="cs" style="margin:12px 0">${opts(data.scarti, "Causa scarto")}</select>
          <button class="btn" style="width:100%" id="regS">Registra scarto</button></section>
        <section class="card"><h2>Fermo macchina</h2>
          <div class="row"><label class="n">Ore<input class="field" id="h" type="number" min="0" max="99" value="0"></label><label class="n">Minuti<input class="field" id="m" type="number" min="0" max="59" value="0"></label><label class="n">Secondi<input class="field" id="s" type="number" min="0" max="59" value="0"></label></div>
          <select class="field" id="cf" style="margin:12px 0">${opts(data.fermi, "Causa fermo")}</select>
          <button class="btn" style="width:100%" id="regF">Registra fermo</button></section>
      </div>`;
    $("#op").value = opState.op; $("#prod").value = opState.prod;
    $("#op").onchange = e => opState.op = e.target.value; $("#prod").onchange = e => opState.prod = e.target.value;
    $("#minusP").onclick = () => $("#pzp").value = Math.max(1, (+$("#pzp").value || 1) - 1);
    $("#plusP").onclick = () => $("#pzp").value = (+$("#pzp").value || 0) + 1;
    $("#minus").onclick = () => $("#pz").value = Math.max(1, (+$("#pz").value || 1) - 1);
    $("#plus").onclick = () => $("#pz").value = (+$("#pz").value || 0) + 1;
    const add = (rec, label) => {
      if (!opState.op || !opState.prod) return alert("Seleziona operatore e prodotto.");
      data.registrazioni.unshift({id: uid(), ts: new Date().toISOString(), operatore: opState.op, prodotto: opState.prod, ...rec});
      save().then(() => { $("#msg").textContent = "✓ " + label + " registrato"; setTimeout(() => { const m = $("#msg"); if (m) m.textContent = ""; }, 2500); });
    };
    $("#regP").onclick = () => { const pz = Math.max(1, parseInt($("#pzp").value) || 0); add({tipo: "Produzione", causa: "", pezzi: pz}, "Produzione"); };
    $("#regS").onclick = () => { const cs = $("#cs").value, pz = Math.max(1, parseInt($("#pz").value) || 0); if (!cs) return alert("Seleziona la causa di scarto."); add({tipo: "Scarto", causa: cs, pezzi: pz}, "Scarto"); };
    $("#regF").onclick = () => {
      const c = (id, max) => Math.max(0, Math.min(max, parseInt($(id).value) || 0));
      const d = c("#h", 99) * 3600 + c("#m", 59) * 60 + c("#s", 59), cf = $("#cf").value;
      if (!cf) return alert("Seleziona la causa di fermo."); if (!d) return alert("Inserisci la durata del fermo.");
      add({tipo: "Fermo", causa: cf, durataSec: d}, "Fermo");
    };
  }
  const f = filtro();
  $("#rows").innerHTML = f.list.map(r => `<tr><td>${new Date(r.ts).toLocaleString("it-IT")}</td><td>${r.tipo}</td><td>${esc(r.operatore)}</td><td>${esc(r.prodotto)}</td><td>${esc(r.causa)}</td><td>${r.pezzi ?? ""}</td><td>${r.tipo === "Fermo" ? fmt(r.durataSec) : ""}</td><td>${role === "admin" ? `<button class="link" data-rdel="${r.id}">Elimina</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="8" class="mut">Nessuna registrazione${f.attivo ? " nel periodo selezionato" : ""}</td></tr>`;
  document.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => { if (confirm("Eliminare la registrazione?")) { data.registrazioni = data.registrazioni.filter(x => x.id !== b.dataset.rdel); save(); } });
  $("#exp").disabled = !f.list.length;
  $("#clr").classList.toggle("hidden", !f.attivo);
  $("#exp").textContent = f.attivo ? `Esporta CSV (${f.list.length} righe)` : "Esporta CSV (Excel)";
}

/* ---------- Avvio ---------- */
(async () => {
  try { const s = localStorage.getItem(LS); if (s) data = {...data, ...JSON.parse(s)}; } catch {}
  const h = await kvGet("dir").catch(() => null);
  if (h) {
    if (await h.queryPermission({mode: "readwrite"}) === "granted") await connect(h);
    else { $("#fname").textContent = "📁 " + h.name + " (clicca Riattiva accesso)"; $("#reauth").classList.remove("hidden"); }
  }
  const r = sessionStorage.getItem("ruolo"); if (r) start(r);
})();
</script>
</body>
</html>
